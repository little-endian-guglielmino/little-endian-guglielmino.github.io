<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Little Endian</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark light">
<script>/* Apply a saved theme before first paint, so the page never flashes. */
(function(){try{var t=localStorage.getItem('le-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#ffffff':'#07080c');}}catch(e){}})();</script>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;450;500;550;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; }
  .nf__code { font-family: var(--font-mono); font-size: clamp(4rem, 16vw, 9rem); line-height: 1; letter-spacing: -.04em; margin: 0 0 8px; }
  .nf .lede { margin-inline: auto; }
  .nf__cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px; }
</style>
</head>
<body>
<section class="nf">
  <div class="hero__bg" aria-hidden="true"></div>
  <div class="hero__grid" aria-hidden="true"></div>
  <div class="wrap hero__in">
    <p class="nf__code grad">404</p>
    <h1 style="font-size:clamp(1.6rem,3.6vw,2.4rem);margin-bottom:16px">This page moved, or never existed.</h1>
    <p class="lede">Our site was rebuilt from scratch, so a few old links no longer resolve. Everything now lives on one page.</p>
    <div class="nf__cta">
      <a class="btn btn--primary" href="/">Go to the homepage</a>
      <a class="btn btn--ghost" href="/it/">Vai al sito italiano</a>
    </div>
  </div>
</section>
<script src="/assets/js/site.js" defer></script>
</body>
</html>
